   .btn {
  --color:#001C68;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: all .5s;
  border: none;
  background-color: transparent;
}

.btn div {
  letter-spacing: 2px;
  font-weight: bold;
 
  border-radius: 2rem;
  color: white;
  padding: 7px;
}

.btn::before {
  content: '';
  z-index: -1;
  background-color: var(--color);
  border: 2px solid white;
  border-radius: 2rem;
  width: 110%;
  height: 100%;
  position: absolute;
  transform: rotate(10deg);
  transition: .5s;
  opacity: 0.2;
}

.btn:hover {
  cursor: pointer;
  filter: brightness(1.2);
  transform: scale(1.1);
}

.btn:hover::before {
  transform: rotate(0deg);
  opacity: 1;
}


.btn:active {
  filter: brightness(1.4);
}

.card {

}

.card:after {
  content: "";
  position: absolute;
  width: 100%;
  height: 8px;

  left: 0;

.button {
  position: relative;
  transition: all 0.3s ease-in-out;
  box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
  padding-block: 0.5rem;

.icon {

}

.button:hover {
  transform: scale(1.05);
  border-color: #fff9;
}

.button:hover .icon {
  transform: translate(4px);
}

.button:hover::before {
  animation: shine 1.5s ease-out infinite;
}

.button::before {
  content: "";
  position: absolute;
  width: 100px;
  height: 100%;
  background-image: linear-gradient(
    120deg,
    rgba(255, 255, 255, 0) 30%,
    rgba(255, 255, 255, 0.8),
    rgba(255, 255, 255, 0) 70%
  );
  top: 0;
  left: -100px;
  opacity: 0.6;
}

@keyframes shine {
  0% {
    left: -100px;
  }

  60% {

  }

}

<script>
(() => {
    'use strict';

    const urlParams = new URLSearchParams(window.location.search);
    const errorMessage = urlParams.get('error');
    const successMessage = urlParams.get('success');

    if (errorMessage) {
        showErrorModal(errorMessage);
    } else if (successMessage) {
        showSuccessModal(successMessage);
    }

    function showErrorModal(message) {
        const errorMessageContainer = document.getElementById('errorMessageContainer');
        errorMessageContainer.innerHTML = '<div class="alert alert-danger" role="alert">' + message + '</div>';
        const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
        errorModal.show();
    }

    function showSuccessModal(message) {
        const successMessageContainer = document.getElementById('successMessageContainer');
        successMessageContainer.innerHTML = '<div class="alert alert-success" role="alert">' + message + '</div>';
        const successModal = new bootstrap.Modal(document.getElementById('successModal'));
        successModal.show();
    }
})();
</script> 
<script>
document.addEventListener("DOMContentLoaded", function() {
    const getOTPButton = document.getElementById("getOTP");

    getOTPButton.addEventListener("click", function(event) {
        event.preventDefault();

        // Get the phone number entered by the user
        const phoneNumber = document.getElementById("phone").value;

        // Make an AJAX request to the servlet to get OTP
        fetch("loginform?getOTP=true&phone=" + phoneNumber)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(data => {
                if (data.includes("Failed")) {
                    // Show error modal or update URL with error message
                    console.log("Failed to send OTP");
                    // Redirect to login page with error message in URL
                    window.location.href = "Login.html?error=Failed%20to%20send%20OTP";
                } else {
                    // Show success modal or update URL with success message
                    console.log("OTP sent successfully");
                    // Redirect to login page with success message in URL
                    window.location.href = "Login.html?success=OTP%20sent%20successfully&number="+encodeURIComponent(phoneNumber);
                }
            })
            .catch(error => {
                console.error('There was a problem with the fetch operation:', error);
                // Show error modal
                console.log("Failed to send OTP");
                // Redirect to login page with error message in URL
                window.location.href = "Login.html?error=Failed%20to%20send%20OTP";
            });
        
    });
    
    const urlParams = new URLSearchParams(window.location.search);
    const numberParam = urlParams.get('number');
    if (numberParam) {
    	var phoneNumberInput = document.getElementById('phone');
        // Set the value of the phone input field
        phoneNumberInput.value = numberParam;
    }
});


</script>
